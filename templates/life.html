{% include '_header.html' %}

            <script>
                swatches = JSON.parse('{{swatches | tojson | safe}}');
                initialState = JSON.parse('{{initialState | tojson | safe}}');
            </script>
            <h1>Conway's Game of Life</h1>
            <button type="button" class="btn bg-warning" id="pause-life">
                <i class="material-icons">pause</i>
            </button>
            <button type="button" class="btn bg-warning" id="play-life">
                <i class="material-icons">play_arrow</i>
            </button>
            <div id="preview-container">
                <div id="preview" class="text-right">
                    <button type="button" class="btn btn-light" id="save-color">
                        <i class="material-icons">save</i>
                    </button>
                </div>
            </div>
            <div class="sliders" id="hue-slider"></div>
            <div class="sliders" id="saturation-slider"/></div>
            <div class="sliders" id="lightness-slider"/></div>

            <label for="life-speed-slider">Speed</label>
            <div class="timing-sliders" id="life-speed-slider"></div>

            <label for="life-organic-slider">Organic</label>
            <div class="timing-sliders" id="life-organic-slider"></div>

            <label for="life-mutation-slider">Mutation</label>
            <div class="timing-sliders" id="life-mutation-slider"></div>

            <label for="life-ember-slider">Ember</label>
            <div class="timing-sliders" id="life-ember-slider"></div>

            <div id="swatch-container"></div>
{% include '_footer.html' %}
